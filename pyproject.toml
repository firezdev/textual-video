[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = 'textual_video'
module-root = ''

[project]
name = "textual-video"
version = "0.1.4"
description = "Video playback widgets & controls for Textual (textual-image based)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textual>=1.0.0,<9.0.0",
    "textual-image>=0.8.5",
    "textual-canvas>=1.1.0",
    "python-ffmpeg>=2.0.12",
    "asanypath>=2.5.0",
    "textual-drivers>=0.10.4",
    "pillow>=13.0.0",
]

[dependency-groups]
dev = ["textual-dev>=1.8.0"]
